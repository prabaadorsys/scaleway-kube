name: Terraform Deployment

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    env:
      TF_VAR_access_key: ${{ secrets.SCALEWAY_ACCESS_KEY }}
      TF_VAR_secret_key: ${{ secrets.SCALEWAY_SECRET_KEY }}
      TF_VAR_project_id: ${{ secrets.SCALEWAY_PROJECT_ID }}
      TF_VAR_region: ${{ secrets.SCALEWAY_REGION }}
      TF_VAR_cluster_name: auto-cluster-${{ github.run_number }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="project_id=${{ secrets.SCALEWAY_PROJECT_ID }}" \
            -out=tfplan
